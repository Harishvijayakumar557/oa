{% extends 'base.html' %} {% block content %}
<div class="container-fluid px-0">
  <section class="page-header mb-4">
    <div
      class="d-flex justify-content-between align-items-center flex-wrap gap-3"
    >
      <div>
        <span class="section-badge"
          ><i class="bi bi-sliders me-2"></i>System Settings</span
        >
        <h1 class="page-title mt-3 mb-0">Application preferences</h1>
      </div>
    </div>
  </section>

  <div class="card-panel p-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Default language</label>
        <select class="form-select">
          <option value="en">English</option>
          <option value="ta">தமிழ்</option>
          <option value="hi">हिन्दी</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Clinical report footer</label>
        <input
          type="text"
          class="form-control"
          value="For screening only, not medical diagnosis."
        />
      </div>
      <div class="col-12 mt-3">
        <button type="button" class="btn btn-primary">Save settings</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
